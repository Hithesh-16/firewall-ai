name: Weekly CN Task

on:
  schedule:
    # Runs at 8/9:30 AM PST (16:30 UTC) every Monday so PR shows up at beginning of week
    - cron: "30 16 * * 1"
  workflow_dispatch: # Allows manual triggering

jobs:
  run-cn-task:
    # Only run this workflow on the main repository (ai-firewall/ai-firewall)
    if: github.repository == 'ai-firewall/ai-firewall'
    uses: ./.github/workflows/run-continue-agent.yml
    with:
      agent: ai-firewall/tidy-up-markdown-agent
      branch_name: main
    secrets:
      CONTINUE_API_KEY: ${{ secrets.CONTINUE_API_KEY }}
