<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Activity bar icon for VS Code.
    VS Code applies a CSS mask so this must be solid-filled shapes.
    Shield with a centered lock/checkmark motif — clean and modern.
  -->

  <!-- Shield body -->
  <path d="M12 1.5 L21 5.5 L21 11 C21 16.5 17.2 20.8 12 22.5 C6.8 20.8 3 16.5 3 11 L3 5.5 Z"
        fill="white"
        fill-opacity="0.15"/>

  <!-- Shield outline -->
  <path d="M12 1.5 L21 5.5 L21 11 C21 16.5 17.2 20.8 12 22.5 C6.8 20.8 3 16.5 3 11 L3 5.5 Z"
        fill="none"
        stroke="white"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Checkmark inside shield -->
  <path d="M8 12.5 L10.8 15.3 L16 9.5"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
