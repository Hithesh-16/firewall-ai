<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Dark background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <!-- Shield stroke gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <!-- "AI" text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f9ff"/>
      <stop offset="100%" style="stop-color:#7dd3fc"/>
    </linearGradient>
    <!-- Glow on shield outline -->
    <filter id="outlineGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Shield fill (very subtle) -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.45"/>
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="256" height="256" rx="40" ry="40" fill="url(#bg)"/>

  <!-- Subtle radial glow in center -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.18"/>
    <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:0"/>
  </radialGradient>
  <rect width="256" height="256" rx="40" ry="40" fill="url(#centerGlow)"/>

  <!-- Shield body fill (translucent) -->
  <path d="M128 24 L218 56 L218 136 Q218 196 128 232 Q38 196 38 136 L38 56 Z"
        fill="url(#shieldFill)"/>

  <!-- Shield outline — glowing stroke -->
  <path d="M128 24 L218 56 L218 136 Q218 196 128 232 Q38 196 38 136 L38 56 Z"
        fill="none"
        stroke="url(#strokeGrad)"
        stroke-width="5"
        stroke-linejoin="round"
        filter="url(#outlineGlow)"/>

  <!-- Shield outline — crisp top layer -->
  <path d="M128 24 L218 56 L218 136 Q218 196 128 232 Q38 196 38 136 L38 56 Z"
        fill="none"
        stroke="url(#strokeGrad)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- "AI" text, large and centered -->
  <text x="128" y="158"
        font-family="'SF Pro Display','Segoe UI','Inter',Arial,sans-serif"
        font-size="96"
        font-weight="700"
        fill="url(#textGrad)"
        text-anchor="middle"
        dominant-baseline="middle"
        letter-spacing="-4"
        filter="url(#textGlow)">AI</text>

  <!-- Thin accent line under text -->
  <line x1="76" y1="182" x2="180" y2="182"
        stroke="url(#strokeGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Small "firewall" label -->
  <text x="128" y="200"
        font-family="'SF Pro Display','Segoe UI','Inter',Arial,sans-serif"
        font-size="16"
        font-weight="400"
        fill="#7dd3fc"
        text-anchor="middle"
        letter-spacing="5"
        opacity="0.75">FIREWALL</text>
</svg>
